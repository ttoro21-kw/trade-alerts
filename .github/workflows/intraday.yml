name: Intraday Alert (10-min monitor)

on:
  schedule:
    - cron: '*/10 13-20 * * 1-5'
    - cron: '0,10 21 * * 1-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: '시간 게이트 무시하고 강제 실행 (테스트용)'
        type: boolean
        default: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run intraday monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
          PYTHONPATH: src
          FORCE_RUN: ${{ inputs.force_run }}
        run: python src/main_intraday.py

      - name: Commit state if changed
        run: |
          git config user.name "trade-alerts-bot"
          git config user.email "bot@noreply.local"
          git add state/ || true
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] intraday state $(date -u +%Y%m%d-%H%M)"
            git push
          else
            echo "No state changes."
          fi
